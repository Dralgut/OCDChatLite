# ===== [ CHAT SETTINGS ] =====
chat:
  types:
    global_chat:
      prefix: "!"
      format: "<yellow>[G] <gray>[<player>] <white><message>"
      distance: -2
    local_chat:
      prefix: ""
      format: "<yellow>[L] <gray>[<player>] <white><message>"
      distance: 48