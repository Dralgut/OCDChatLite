name: OCDChatLite
version: '${version}'

main: com.ocd.ocdchatlite.OCDChatLite
api-version: '1.21'
load: POSTWORLD

authors: [ Dralgut ]
softdepend: ["PlaceholderAPI"]

commands:
  ocdchatlite:
    description: OCDChatLite management
    usage: /ocdchatlite
    aliases:
      - ocdcl
    permission: ocdchatlite.reload
    permission-message: "§cYou dont have permission"

permissions:
  ocdchatlite.reload:
    default: op